<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="dnsdoctor - Diagnose DNS across resolvers"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#0e7490"/></linearGradient><linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#ffffff"/><animate attributeName="x1" values="-1;0.5" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1.5" dur="5s" repeatCount="indefinite"/></linearGradient><pattern id="gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".07"/></pattern><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter></defs><rect width="900" height="260" rx="22" fill="url(#bg)"/><rect width="900" height="260" rx="22" fill="url(#gr)"/><circle r="80" fill="#22d3ee" opacity=".45" filter="url(#bl)"><animate attributeName="cx" values="120;780;120" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="50;210;50" dur="8s" repeatCount="indefinite"/></circle><circle r="70" fill="#a5f3fc" opacity=".35" filter="url(#bl)"><animate attributeName="cx" values="780;120;780" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="210;40;210" dur="9s" repeatCount="indefinite"/></circle><g stroke="#a5f3fc" stroke-opacity=".35" stroke-width="1.5"><path d="M450 222L300 222M450 222L600 222M450 222L450 200"/></g><g fill="#a5f3fc"><circle cx="300" cy="222" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="450" cy="222" r="6"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="600" cy="222" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle></g><text x="450" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#tx)">dnsdoctor</text><text x="450" y="164" text-anchor="middle" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#ffffff" fill-opacity="0">Ask many resolvers at once and spot the mismatch<animate attributeName="fill-opacity" values="0;.88" dur="2s" fill="freeze"/></text></svg>
